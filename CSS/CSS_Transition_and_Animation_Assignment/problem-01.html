<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
        }
        header{
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        header h2{
            color: #2563eb  ;
        }
        .slider {
        height: 320px;
        overflow: hidden;
        position: relative;
        }

    .slides {
      display: flex;
      width: 300%;
      height: 100%;
      animation: slide 12s infinite;
    }

    .slide {
      width: 33.333%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      background-size: cover;
      background-position: center;
      text-align: center;
    }

    .slide:nth-child(1) {
      background-image:
        url("https://picsum.photos/id/1018/1200/500");
    }

    .slide:nth-child(2) {
      background-image:
        url("https://picsum.photos/id/1015/1200/500");
    }

    .slide:nth-child(3) {
      background-image:
        url("https://picsum.photos/id/1016/1200/500");
    }

    @keyframes slide {
      0%, 28% {
        transform: translateX(0);
      }

      33%, 61% {
        transform: translateX(-33.3333%);
      }

      66%, 94% {
        transform: translateX(-66.6667%);
      }

      100% {
        transform: translateX(0);
      }
    }

    .slide h1 {
      font-size: clamp(28px, 5vw, 48px);
      margin: 0 0 12px;
      animation: appear 1.2s ease-out both;
    }

    .slide p {
      font-size: 18px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn {
      border: none;
      padding: 13px 25px;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.5s,
                  background 0.5s;
      margin: 20px;
    }

    .btn:hover {
      transform: scale(1.1);
      background: #1d4ed8;
    }

    .content {
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      max-width: 340px;
      background: white;
      padding: 28px;
      text-align: center;
      border-radius: 16px;
      box-shadow: 0 8px 25px #0001;
      animation: float 2s ease-in-out infinite alternate;
    }

    @keyframes float {
      to {
        transform: translateY(-12px);
      }
    }

    .spinner {
      width: 35px;
      height: 35px;
      margin: 20px auto;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }

    }
    </style>
</head>
<body>
    <main>
        <header>
            <h2>AnimateX</h2>
            <span>Learn CSS Animation</span>
        </header>
        <section class="slider">
            <div class="slides">
                <div class="slide">
                    <h1>Explore the World</h1>
                    <p>Bring your website to life.</p>
                    <button class="btn">Discover More</button>
                </div>
                <div class="slide">
                    <h1>Learn Something New</h1>
                    <p>Create beautiful Web Experiences.</p>
                    <button class="btn">Explore Now</button>
                    
                </div>
                <div class="slide">
                    <h1>Imagine And Create</h1>
                    <p>Make your ideas move.</p>
                    <button class="btn">Explore Now</button>
                    
                </div>
                <div class="slide"></div>
            </div>
        </section>
    </main>
</body>
</html>
